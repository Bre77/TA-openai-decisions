[decide-command]
syntax = decide (<string>|prompt=<string>) (field=<field>)? (output=<field>)? (error_field=<field>)? (model=<string>)? (cache=<bool>)? (limit=<int>)? (distributed=<bool>)?
shortdesc = Scores each event against a yes/no prompt with the OpenAI Decisions API.
description = Give the yes/no prompt as the first argument in double quotes, or as \
    prompt="<string>". Sends the value of a field (default _raw) to the OpenAI Decisions API as a \
    predicate question and adds the probability that the answer is yes (0 to 1) to the \
    event in the output field (default decision_probability). Events are never dropped: \
    filter with a following where command. When an event cannot be decided (API error, \
    timeout, refusal, empty input) the probability is left empty and a short reason is \
    written to error_field (default decision_error). Results are cached in a KV store \
    collection unless cache=false or the cache is disabled on the Configuration page. While \
    the cache is enabled, every event also gets decision_from_cache, true when its \
    probability came from the cache and false otherwise. \
    At most limit API calls (default 1000) are made per search; cache hits do not count, and \
    limit=0 means no limit. Once the limit is reached, events that need another call are kept \
    with their fields empty and "limit of <n> API calls reached" in error_field, and the \
    search shows a warning. \
    With distributed=true, the indexers also run the command on their events and call the \
    API themselves. The cache is then off, and cache=true and limit are not allowed. Each \
    indexer needs the API key: see the add-on's README.
usage = public
example1 = index=auth | decide "Is this a failed login?" | where decision_probability > 0.8
comment1 = Keep only events the model judges to be failed logins.
example2 = sourcetype=tickets | decide "Is the customer asking for a refund?" field=body output=refund_p cache=false
comment2 = Decide on the body field, write the probability to refund_p, and skip the cache.
example3 = index=web | decide "Does this request look like an injection attempt?" distributed=true
comment3 = Decide on the indexers, which call the API themselves.
appears-in = 1.0.0
category = streaming
maintainer = Brett Adams
tags = openai decision predicate classify filter ai llm


[choose-command]
syntax = choose <string> <string> <string> <string> <string> (<string> <string>)* (field=<field>)? (output=<field>)? (error_field=<field>)? (model=<string>)? (cache=<bool>)? (limit=<int>)? (distributed=<bool>)?
shortdesc = Picks one of several options for each event with the OpenAI Decisions API.
description = Give the question as the first argument in double quotes, followed by two or \
    more options (at most 255), each a distinct value and then its description. Quote a value \
    or description that contains spaces. Sends the value of a field (default _raw) to the \
    OpenAI Decisions API as a choice question and adds the chosen option's value to the output \
    field (default choice), its probability to <output>_probability, the answer's confidence to \
    <output>_confidence, and the probability of every option to <output>_probability_<value>, \
    where each run of characters other than letters, digits and underscores in the value \
    becomes an underscore. Events are never dropped. When an event cannot be decided (API \
    error, timeout, refusal, empty input) those fields are left empty and a short reason is \
    written to error_field (default choice_error). Results are cached in a KV store collection \
    unless cache=false or the cache is disabled on the Configuration page. While the cache is \
    enabled, every event also gets choice_from_cache, true when its answer came from the cache \
    and false otherwise. \
    At most limit API calls (default 1000) are made per search; cache hits do not count, and \
    limit=0 means no limit. Once the limit is reached, events that need another call are kept \
    with their fields empty and "limit of <n> API calls reached" in error_field, and the \
    search shows a warning. \
    With distributed=true, the indexers also run the command on their events and call the \
    API themselves. The cache is then off, and cache=true and limit are not allowed. Each \
    indexer needs the API key: see the add-on's README.
usage = public
example1 = sourcetype=tickets | choose "Which team should handle this ticket?" network "Routers, firewalls and DNS" storage "Disks, backups and file shares" "service desk" "Laptops, accounts and everything else" field=body
comment1 = Route each ticket body to a team, and add choice, choice_probability, choice_confidence and choice_probability_<team>.
example2 = index=web | choose "What kind of request is this?" browsing "A person using the site" api "A program calling the API" scanner "A vulnerability scanner or crawler" output=kind | where kind_probability > 0.8 | stats count by kind
comment2 = Classify requests into kind, and count only the confident classifications.
appears-in = 1.2.0
category = streaming
maintainer = Brett Adams
tags = openai decision choice classify route ai llm

[grade-command]
syntax = grade <string> <string> <string> <string> <string> (<string> <string>)* (field=<field>)? (output=<field>)? (error_field=<field>)? (model=<string>)? (cache=<bool>)? (limit=<int>)? (distributed=<bool>)?
shortdesc = Grades each event against ordered levels with the OpenAI Decisions API.
description = Give the question as the first argument in double quotes, followed by two or \
    more levels from lowest to highest, each a label and then its description. Quote a label \
    or description that contains spaces. Sends the value of a field (default _raw) to the \
    OpenAI Decisions API as a score question and adds the score to the output field (default \
    grade): the probability-weighted average of the level indices, from 0 for the first level \
    to the number of levels minus 1 for the last. Also adds the answer's confidence to \
    <output>_confidence and the probability of every level to <output>_probability_<label>, \
    where each run of characters other than letters, digits and underscores in the label \
    becomes an underscore. Events are never dropped. When an event cannot be decided (API \
    error, timeout, refusal, empty input) those fields are left empty and a short reason is \
    written to error_field (default grade_error). Results are cached in a KV store collection \
    unless cache=false or the cache is disabled on the Configuration page. While the cache is \
    enabled, every event also gets grade_from_cache, true when its answer came from the cache \
    and false otherwise. \
    At most limit API calls (default 1000) are made per search; cache hits do not count, and \
    limit=0 means no limit. Once the limit is reached, events that need another call are kept \
    with their fields empty and "limit of <n> API calls reached" in error_field, and the \
    search shows a warning. \
    With distributed=true, the indexers also run the command on their events and call the \
    API themselves. The cache is then off, and cache=true and limit are not allowed. Each \
    indexer needs the API key: see the add-on's README.
usage = public
example1 = index=auth | grade "How severe is this event?" low "Routine activity, no action needed" medium "Worth a look during business hours" high "Needs immediate investigation" | where grade > 1.5
comment1 = Rate each event from 0 (low) to 2 (high), and keep the severe ones.
example2 = sourcetype=tickets | grade "How urgent is this ticket?" routine "Can wait a week" urgent "Needs a reply today" field=body output=urgency
comment2 = Rate each ticket body, and write the score to urgency and the level probabilities to urgency_probability_routine and urgency_probability_urgent.
appears-in = 1.2.0
category = streaming
maintainer = Brett Adams
tags = openai decision grade score rubric severity ai llm
