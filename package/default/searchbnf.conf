[decide-command]
syntax = decide (<string>|prompt=<string>) (field=<field>)? (output=<field>)? (error_field=<field>)? (model=<string>)? (cache=<bool>)?
shortdesc = Scores each event against a yes/no prompt with the OpenAI Decisions API.
description = Give the yes/no prompt as the first argument in double quotes, or as \
    prompt="<string>". Sends the value of a field (default _raw) to the OpenAI Decisions API as a \
    predicate question and adds the probability that the answer is yes (0 to 1) to the \
    event in the output field (default decision_probability). Events are never dropped: \
    filter with a following where command. When an event cannot be decided (API error, \
    timeout, refusal, empty input) the probability is left empty and a short reason is \
    written to error_field (default decision_error). Results are cached in a KV store \
    collection unless cache=false or the cache is disabled on the Configuration page. While \
    the cache is enabled, every event also gets decision_from_cache, true when its \
    probability came from the cache and false otherwise.
usage = public
example1 = index=auth | decide "Is this a failed login?" | where decision_probability > 0.8
comment1 = Keep only events the model judges to be failed logins.
example2 = sourcetype=tickets | decide "Is the customer asking for a refund?" field=body output=refund_p cache=false
comment2 = Decide on the body field, write the probability to refund_p, and skip the cache.
appears-in = 1.0.0
category = streaming
maintainer = Brett Adams
tags = openai decision predicate classify filter ai llm

