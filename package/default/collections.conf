# Result cache for the decide, choose and grade search commands. _key is
# sha256(model, prompt, input) for decide, and sha256(question type, model,
# prompt, options, input) for choose and grade. Only successful answers are
# stored: a probability for decide; the choice or score, its confidence and
# the per-option probabilities (a JSON array in option order) for the others.
[ta_openai_decisions_cache]
field.probability = number
field.choice = string
field.score = number
field.confidence = number
field.probabilities = string
field.created = number
accelerated_fields.created = {"created": 1}
replicate = false
