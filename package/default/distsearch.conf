# Lets decide, choose and grade run on the indexers with distributed=true.
# Splunk reads these lists only at startup, so restart the search head after
# installing or upgrading the add-on.
#
# The commands run on a search peer from the knowledge bundle, so the bundle
# carries the add-on's lib/ (bin/ is replicated by default). It also carries
# the add-on's own settings and its encrypted credentials, which a peer can
# decrypt only when it shares the search head's splunk.secret. The entries are
# scoped to this app: never set replicate.passwords, which would replicate
# every app's passwords.conf.

[replicationAllowlist]
ta_openai_decisions_lib = apps/TA-openai-decisions/lib/...

[replicationSettings:fileSpecific]
apps/TA-openai-decisions/default/ta_openai_decisions_settings.conf = allow
apps/TA-openai-decisions/local/ta_openai_decisions_settings.conf = allow
apps/TA-openai-decisions/local/passwords.conf = allow
