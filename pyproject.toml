# Development tooling only; the add-on itself is built by ucc-gen from
# globalConfig.json and package/.
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "choose",
    "conftest",
    "decide",
    "decision_cache",
    "decisions_command",
    "grade",
    "openai_decisions",
    "stub_decisions_api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
