# CI gate on every push/PR: unit tests on both Splunk Python runtimes, a pinned
# ucc-gen build with packaging assertions and local AppInspect (precert and
# Splunk Cloud tags), and the fleet's ucc-gen build + local AppInspect.
# Credential-free by design.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  appinspect:
    uses: Bre77/splunk_nats/.github/workflows/_reusable-build-appinspect.yml@main
    with:
      app_dir: "."
      use_ucc_gen: true
      splunk_python_version: "3.9"
      fail_on: "errors"

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r package/lib/requirements.txt pytest ruff
      - name: Lint
        run: |
          ruff check package/bin tests
          ruff format --check package/bin tests
      - name: Unit tests
        run: python -m pytest -v

  build:
    uses: ./.github/workflows/_build.yml
