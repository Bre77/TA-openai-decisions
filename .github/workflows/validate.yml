# CI gate on every push/PR: unit tests on both Splunk Python runtimes, a pinned
# ucc-gen build with packaging assertions, and the fleet's ucc-gen build + local
# AppInspect. Credential-free by design.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  appinspect:
    uses: Bre77/splunk_nats/.github/workflows/_reusable-build-appinspect.yml@main
    with:
      app_dir: "."
      use_ucc_gen: true
      splunk_python_version: "3.9"
      fail_on: "errors"

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r package/lib/requirements.txt pytest ruff
      - name: Lint
        run: |
          ruff check package/bin tests
          ruff format --check package/bin tests
      - name: Unit tests
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install ucc-gen
        run: python -m pip install splunk-add-on-ucc-framework==6.5.3
      - name: Build and package
        # build.sh fails on any native library in the vendored lib/.
        run: ./build.sh "$(python -c 'import json; print(json.load(open("globalConfig.json"))["meta"]["version"])')"
      - name: Check the build
        run: |
          set -euo pipefail
          app=output/TA-openai-decisions
          git diff --exit-code globalConfig.json
          ls "$app"/lib/splunk_sdk-2.*.dist-info >/dev/null
          grep -q '^python.required = 3.9, 3.13$' "$app/default/commands.conf"
          grep -q '^python.required = 3.9, 3.13$' "$app/default/restmap.conf"
          ls dist/TA-openai-decisions-*.tar.gz
